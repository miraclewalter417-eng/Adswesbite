<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | eTrend Gigs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-hero {
            background: var(--gradient);
            padding: 120px 0 60px;
            color: white;
            text-align: center;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 50px;
            margin-top: -50px;
            background: white;
            padding: 50px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .contact-info-card {
            background: var(--primary);
            color: white;
            padding: 40px;
            border-radius: var(--radius);
        }

        .contact-info-card h3 {
            color: white;
            margin-bottom: 25px;
        }

        .info-item {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-item i {
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .contact-form .form-group {
            margin-bottom: 20px;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        .contact-form textarea {
            height: 150px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
        }

        @media (max-width: 992px) {
            .contact-grid {
                grid-template-columns: 1fr;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header scrolled">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html"><img src="https://etrendgigs.com/assets/images/logo/logo.png" alt="Logo"></a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#" class="active">Contact Us</a></li>
                </ul>
            </nav>
            <div class="header-cta">
                <a href="auth.html" class="btn btn-get-started">Get started</a>
            </div>
        </div>
    </header>

    <div class="contact-hero">
        <div class="container">
            <h1>Contact Us</h1>
            <p>We're here to help you grow your business and social visibility.</p>
        </div>
    </div>

    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info-card">
                    <h3>Contact Information</h3>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>123 Digital Street, Lagos, Nigeria</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-phone-alt"></i>
                        <p>+234 800 000 0000</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <p>support@etrendgigs.com</p>
                    </div>
                    <div class="social-links" style="margin-top: 40px;">
                        <a href="#"><i class="fab fa-facebook-f"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
                <div class="contact-form">
                    <form>
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="Subject">
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Your Message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-submit">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer copied from index.html (Simplified for here) -->
    <footer class="footer" style="margin-top: 80px;">
        <div class="container">
            <div class="footer-bottom text-center" style="border: none;">
                <p>&copy; 2026 eTrend Gigs. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
